# 매일 아침 휴대폰으로 확인할 수 있게, 푸시되면 WebGL을 빌드해서 Cloudflare Pages에 올린다.
# 예약 작업이 도는 클라우드에는 Unity가 없으므로 빌드는 여기서만 돈다.
#
# 필요한 저장소 비밀값 5개 (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE          C:\ProgramData\Unity\Unity_lic.ulf 파일 내용 전체
#   UNITY_EMAIL            Unity 계정 이메일
#   UNITY_PASSWORD         Unity 계정 비밀번호
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > Edit Cloudflare Workers 권한
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 주소에 들어 있는 32자리 값
#
# 빌드가 실패하면 tools/deploy_web.ps1로 PC에서 직접 빌드해 올릴 수 있다.

name: WebGL 빌드와 배포

on:
  push:
    branches: [main, claude/dev]
  workflow_dispatch:

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: WebGL 빌드 후 Cloudflare Pages 배포
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library 캐시가 없으면 빌드가 40분을 넘긴다. 첫 빌드만 느리고 이후에는 10분 안쪽이다.
      - uses: actions/cache@v4
        with:
          path: PlanetRacer/Library
          key: Library-WebGL-${{ hashFiles('PlanetRacer/Assets/**','PlanetRacer/Packages/**','PlanetRacer/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: PlanetRacer
          targetPlatform: WebGL
          buildName: PlanetRacer
          allowDirtyBuild: true

      # game-ci는 도커 안에서 root로 빌드하기 때문에 결과 폴더가 root 소유로 남는다.
      # 이대로는 파일 하나 복사하는 것도 Permission denied가 난다.
      - name: 빌드 결과 권한 정리
        run: sudo chown -R $(id -u):$(id -g) build

      # Cloudflare가 .br 파일을 압축 해제된 것으로 착각하지 않게 헤더를 같이 올린다.
      - name: 헤더 파일 넣기
        run: cp web/_headers build/WebGL/PlanetRacer/_headers

      # 파일 하나가 25MiB를 넘으면 Cloudflare Pages가 거부한다. 미리 잡아서 알려 준다.
      - name: 파일 크기 확인
        run: |
          big=$(find build/WebGL/PlanetRacer -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::25MiB를 넘는 파일이 있어 Cloudflare Pages에 올릴 수 없다:"
            echo "$big" | xargs -r ls -lh
            exit 1
          fi
          du -sh build/WebGL/PlanetRacer

      # Pages 프로젝트가 없으면 배포가 거부된다. 이미 있으면 에러가 나지만 무시한다.
      - name: Pages 프로젝트 준비
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create planetracer --production-branch=main

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/WebGL/PlanetRacer --project-name=planetracer --branch=${{ github.ref_name == 'main' && 'main' || 'dev' }} --commit-dirty=true

      # 배포된 걸 실제로 열어 본다. 헤더까지 확인한다.
      # Content-Encoding이 "br, br"로 나가면 브라우저가 두 번 풀려다 죽는다.
      # _headers 규칙이 한 파일에 두 개 걸리면 그렇게 된다. 2026-09-11에 실제로 겪었다.
      - name: 배포 확인
        run: |
          url=https://planetracer-daz.pages.dev
          fail=0
          for f in PlanetRacer.wasm.br PlanetRacer.framework.js.br PlanetRacer.data.br; do
            code=""; enc=""
            for try in 1 2 3 4 5 6; do
              sleep 10
              h=$(curl -sSI -H 'Accept-Encoding: br' "$url/Build/$f" || true)
              code=$(printf '%s' "$h" | head -1 | awk '{print $2}')
              enc=$(printf '%s' "$h" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')
              [ "$code" = "200" ] && break
            done
            echo "$f  http=$code  content-encoding=[$enc]"
            if [ "$code" != "200" ]; then
              echo "::error::$f 가 $code 로 응답한다. 배포가 안 올라갔다"
              fail=1
            fi
            if [ "$enc" != "br" ]; then
              echo "::error::$f 의 Content-Encoding이 '$enc' 다. 'br' 하나여야 한다. web/_headers 규칙이 겹쳤는지 볼 것"
              fail=1
            fi
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/")
          echo "index.html  http=$code"
          [ "$code" = "200" ] || { echo "::error::첫 페이지가 $code 로 응답한다"; fail=1; }
          exit $fail

      - name: 빌드 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL/PlanetRacer
          retention-days: 7
