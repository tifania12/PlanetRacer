# 매일 아침 휴대폰으로 확인할 수 있게, 푸시되면 WebGL을 빌드해서 Cloudflare Pages에 올린다.
# 예약 작업이 도는 클라우드에는 Unity가 없으므로 빌드는 여기서만 돈다.
#
# 필요한 저장소 비밀값 5개 (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE          C:\ProgramData\Unity\Unity_lic.ulf 파일 내용 전체
#   UNITY_EMAIL            Unity 계정 이메일
#   UNITY_PASSWORD         Unity 계정 비밀번호
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > Edit Cloudflare Workers 권한
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 대시보드 주소에 들어 있는 32자리 값
#
# 빌드가 실패하면 tools/deploy_web.ps1로 PC에서 직접 빌드해 올릴 수 있다.

name: WebGL 빌드와 배포

on:
  push:
    branches: [main, claude/dev]
  workflow_dispatch:

# 빌드를 취소하지 않는다 (2026-09-16). WebGL 빌드는 10~16분 걸리는데 밤 세션은 매시간,
# 때로는 더 자주 푸시한다. cancel-in-progress: true 였을 때 claude/dev 최근 20개 중
# 12개가 취소됐고, 그래서 "직전 빌드 성공" 조건이 안 채워져 main 승격이 계속 밀렸다.
# 이제는 줄을 서서 차례로 돈다 — 느려도 커밋마다 결론이 하나씩 남는다.
concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: WebGL 빌드 후 Cloudflare Pages 배포
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library 캐시가 없으면 빌드가 40분을 넘긴다. 첫 빌드만 느리고 이후에는 10분 안쪽이다.
      - uses: actions/cache@v4
        with:
          path: PlanetRacer/Library
          key: Library-WebGL-${{ hashFiles('PlanetRacer/Assets/**','PlanetRacer/Packages/**','PlanetRacer/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 2026-09-14: 빌드가 exit code 139(세그폴트)로 죽기 시작했다. stripEngineCode를 끄고
      # 예외 처리를 켜면서 IL2CPP가 쓰는 메모리가 늘어난 것이 원인으로 보인다.
      # ubuntu-latest 러너의 물리 메모리만으로는 모자라서 스왑을 붙인다.
      # 스왑이 걸리면 느려지지만 죽는 것보다는 낫다.
      # 주의: GitHub 러너에는 이미 /swapfile 이 켜진 채로 온다. 거기에 fallocate 를 하면
      # "Text file busy" 로 죽는다(2026-09-14에 이것 때문에 잡이 43초 만에 실패했다).
      # 그래서 큰 임시 디스크(/mnt)에 별도 파일로 만들고, 실패해도 빌드는 계속 가게 둔다.
      - name: 스왑 추가 (IL2CPP 메모리 부족 대비)
        continue-on-error: true
        run: |
          echo "=== 지금 메모리/스왑 ==="
          free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "=== 스왑 추가 후 ==="
          free -h

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: PlanetRacer
          targetPlatform: WebGL
          buildName: PlanetRacer
          allowDirtyBuild: true

      # game-ci는 도커 안에서 root로 빌드하기 때문에 결과 폴더가 root 소유로 남는다.
      # 이대로는 파일 하나 복사하는 것도 Permission denied가 난다.
      - name: 빌드 결과 권한 정리
        run: sudo chown -R $(id -u):$(id -g) build

      # Cloudflare가 .br 파일을 압축 해제된 것으로 착각하지 않게 헤더를 같이 올린다.
      - name: 헤더 파일 넣기
        run: cp web/_headers build/WebGL/PlanetRacer/_headers

      # 파일 하나가 25MiB를 넘으면 Cloudflare Pages가 거부한다. 미리 잡아서 알려 준다.
      - name: 파일 크기 확인
        run: |
          big=$(find build/WebGL/PlanetRacer -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::25MiB를 넘는 파일이 있어 Cloudflare Pages에 올릴 수 없다:"
            echo "$big" | xargs -r ls -lh
            exit 1
          fi
          du -sh build/WebGL/PlanetRacer

      # Pages 프로젝트가 없으면 배포가 거부된다. 이미 있으면 에러가 나지만 무시한다.
      - name: Pages 프로젝트 준비
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create planetracer --production-branch=main

      - name: Cloudflare Pages 배포
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/WebGL/PlanetRacer --project-name=planetracer --branch=${{ github.ref_name == 'main' && 'main' || 'dev' }} --commit-dirty=true

      # 배포된 걸 실제로 열어 본다. 헤더만 보면 놓치는 게 있어서
      # 브라우저가 하는 일을 그대로 흉내 낸다 — br 로 받아서 딱 한 번 풀고,
      # 나온 것이 진짜 자바스크립트인지 wasm 인지 확인한다.
      # (2026-09-11에 Content-Encoding 이 "br, br" 로 나가 브라우저가 두 번 풀려다 죽었다.
      #  그때 http 200 확인만으로는 못 잡았다)
      #
      # 9/12 오후 발견: 지금까지 이 스텝은 URL을 안 넘겨서 항상 check_web_deploy.js의
      # 기본값(main 기준 프로덕션 주소)만 확인했다 — claude/dev로 push한 날도 마찬가지였다.
      # main은 --branch=main일 때만 실제로 바뀌니, claude/dev push에서는 "배포 확인 성공"이
      # 떠도 사실 그 전에 올라간 main 내용을 다시 확인한 것뿐이고 이번에 새로 배포한 dev
      # 프리뷰는 한 번도 열어 본 적이 없었다는 뜻이다. wrangler-action이 배포 URL을
      # deployment-url(또는 pages-deployment-alias-url) 출력으로 준다고 알려져 있어 그걸
      # 넘기게 고쳤다 — 이름이 다르면 빈 문자열이 되어 check_web_deploy.js가 기존 기본값으로
      # 그냥 넘어가니 안전하지만(하위 호환), 실제로 dev 프리뷰 주소를 확인했는지는 이번 실행의
      # "대상: ..." 로그 줄로 다음 세션이 확인할 것.
      - name: 배포 확인
        run: |
          url="${{ steps.deploy.outputs.deployment-url || steps.deploy.outputs.pages-deployment-alias-url }}"
          for try in 1 2 3 4 5; do
            sleep 10
            if node tools/check_web_deploy.js "$url"; then exit 0; fi
            echo "재시도 $try"
          done
          echo "::error::배포된 페이지가 브라우저에서 열리지 않는다. 위 로그의 X 줄을 볼 것"
          exit 1

      # W-06: 모바일 LTE에서 10초를 넘으면 에셋을 줄이기로 한 예산(backlog W-06/CLAUDE.md).
      # 클라우드 세션엔 폰도 브라우저 프로파일러도 없어서, 방금 배포한 실제 파일 크기로
      # 대역폭별 다운로드 시간만 계산한다(파싱·초기화 시간은 안 잰다 — 그만큼 실제는 더 걸린다).
      # 지금은 예산을 넘겨도 빌드를 실패시키진 않는다(continue-on-error) — 에셋을 줄이는 건
      # 별도 작업이라, 먼저는 "넘겼다"는 사실을 매 배포마다 로그로 남기는 것부터 시작한다.
      - name: 로딩 시간 예산 확인 (모바일 LTE 10초)
        continue-on-error: true
        run: |
          url="${{ steps.deploy.outputs.deployment-url || steps.deploy.outputs.pages-deployment-alias-url }}"
          node tools/measure_web_load.js "$url"

      - name: 빌드 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL/PlanetRacer
          retention-days: 7
